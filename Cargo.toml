[package]
name = "buffo"
version = "0.9.0"
edition = "2021"
repository = "https://github.com/al8n/buffo"
homepage = "https://github.com/al8n/buffo"
documentation = "https://docs.rs/buffo"
description = "Memory-backed buffer toolkit with Chunk/ChunkMut traits for predictable, explicit, and retry-friendly access; ideal for Sans-I/O style protocol parsers, database engines, and embedded systems."
license = "MIT OR Apache-2.0"
rust-version = "1.95.0"
keywords = [
  "buf",
  "bufmut",
  "bufio",
  "buffer",
  "bytes",
]
categories = ["no-std", "no-std::no-alloc", "network-programming", "data-structures", "encoding"]

[features]
default = ["std"]
alloc = ["varing/alloc", "smol_bytes_01?/alloc", "smol_bytes_02?/alloc"]
std = ["thiserror/default", "varing/default", "bytes_1?/default", "smol_bytes_01?/std", "smol_bytes_02?/std"]

[dependencies]
thiserror = { version = "2", default-features = false }
varing = { version = "0.14", default-features = false }
paste = "1"

bytes_1 = { package = "bytes", version = "1.9", default-features = false, optional = true }
smol_bytes_01 = { package = "smol-bytes", version = "0.1", default-features = false, optional = true }
smol_bytes_02 = { package = "smol-bytes", version = "0.2", default-features = false, optional = true }

[dev-dependencies]
criterion = "0.8"

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
] }
